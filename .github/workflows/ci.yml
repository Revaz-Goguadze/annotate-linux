name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wayland/cairo headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libcairo2-dev libwayland-dev libxkbcommon-dev
      - run: cargo test
